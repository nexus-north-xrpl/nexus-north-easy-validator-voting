<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Easy Validator Voting</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand"><img src="/favicon.svg" alt="" width="34" height="34"><div><h1>Easy Validator Voting</h1><p id="srv">connecting to rippled…</p></div></div>
  <nav class="tabs" aria-label="Sections">
    <button type="button" data-tab="open" aria-pressed="true">Needs a vote <span id="nOpen"></span></button>
    <button type="button" data-tab="done" aria-pressed="false">Enabled &amp; obsolete <span id="nDone"></span></button>
    <button type="button" data-tab="log" aria-pressed="false">Vote log</button>
    <button type="button" data-tab="about" aria-pressed="false">About</button>
  </nav>
</header>
<main>
  <div id="notes"></div>
  <p class="msg" id="msg" role="status"></p>
  <section id="open" class="tab"></section>
  <section id="done" class="tab" hidden></section>
  <section id="log" class="tab" hidden></section>
  <section id="about" class="tab" hidden></section>
</main>
<div class="modal" id="modal" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle"></h2><div id="mBody"></div></div></div>
<footer>Runs only on this machine and talks only to your rippled admin port. Votes are confirmed in Xaman by your operator wallet. Open source, MIT license, no tracking.</footer>
</body>
</html>
