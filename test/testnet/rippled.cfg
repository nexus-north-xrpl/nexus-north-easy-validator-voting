# Throwaway TESTNET rippled for testing Easy Validator Voting. Never use this file for a real server.
# Admin port 5005 listens on 127.0.0.1 inside the container only.
[server]
port_admin
port_peer

[port_admin]
port = 5005
ip = 127.0.0.1
admin = 127.0.0.1
protocol = http

[port_peer]
port = 51235
ip = 0.0.0.0
protocol = peer

[node_size]
small

[node_db]
type=NuDB
path=/var/lib/xrpld/db/nudb
online_delete=512
advisory_delete=0

[ledger_history]
256

[database_path]
/var/lib/xrpld/db

[debug_logfile]
/var/log/xrpld/debug.log

[network_id]
1

[ips]
s.altnet.rippletest.net 51235

[validators_file]
validators.txt

[rpc_startup]
{ "command": "log_level", "severity": "warning" }

[ssl_verify]
1
